name: Dispatch WhatsApp reminders

on:
  schedule:
    # a cada 5 minutos, 09:00-14:55 UTC = 06:00-11:55 horario de Brasilia.
    # a propria rota decide nao fazer nada fora de 06:00-11:00 — essa faixa
    # so garante cobertura de sobra nas bordas.
    - cron: "*/5 9-14 * * *"
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de disparo
        run: |
          curl -sf -X GET "https://projeto-wecare-portal.vercel.app/api/cron/dispatch-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

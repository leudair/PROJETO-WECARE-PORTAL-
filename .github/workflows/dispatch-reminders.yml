name: Dispatch WhatsApp reminders

# O AGENDAMENTO NAO MORA MAIS AQUI.
# Este workflow pedia "*/5 9-14 * * *" (72 execucoes por dia) e o GitHub
# Actions entregava 1 ou 2, nas horas 13-18 UTC — quase sempre FORA da janela
# de 09:00-14:00 UTC que a rota exige, entao a rota respondia "fora da janela"
# e nao mandava nada. Era essa a razao de so existirem 59 disparos em seis
# semanas. O cron do GitHub Actions e' best-effort e e' atrasado/descartado
# sob carga; nao serve pra isso.
#
# O agendamento agora e' o cron da Vercel (vercel.json), que dispara no
# horario. Aqui fica apenas o acionamento manual.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar a janela de horario e forcar o disparo agora (so pra teste manual)"
        type: boolean
        default: false

# cancel-in-progress: false porque matar uma execucao no meio deixaria reservas
# de disparo penduradas em 'scheduled'. Mesmo que um acionamento manual caia
# junto com um tick do cron da Vercel, nao sai mensagem duplicada: o disparo
# reserva a linha em reminder_dispatches antes de enviar, e quem perde a
# corrida no unique index desiste sem enviar (ver claimDispatch).
concurrency:
  group: dispatch-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de disparo
        run: |
          curl -sf -X GET "https://portalwecare.com.br/api/cron/dispatch-reminders${{ inputs.force && '?force=1' || '' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

name: Dispatch WhatsApp reminders

on:
  schedule:
    # a cada 5 minutos, 09:00-14:55 UTC = 06:00-11:55 horario de Brasilia.
    # a propria rota decide nao fazer nada fora de 06:00-11:00 — essa faixa
    # so garante cobertura de sobra nas bordas.
    - cron: "*/5 9-14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar a janela de horario e forcar o disparo agora (so pra teste manual)"
        type: boolean
        default: false

# Este workflow e' o UNICO agendador do disparo. Antes havia tambem um cron no
# vercel.json apontando pra mesma rota: as 09:00 UTC os dois disparavam juntos,
# as duas execucoes liam a mesma lista de pendentes e o mesmo lembrete saia
# duas vezes. O vercel.json foi removido junto com esta mudanca.
#
# concurrency evita o mesmo efeito entre ticks deste workflow: o cron do GitHub
# Actions atrasa com frequencia e as vezes dispara execucoes em sequencia
# imediata. cancel-in-progress: false porque matar uma execucao no meio
# deixaria reservas de disparo penduradas em 'scheduled'.
concurrency:
  group: dispatch-reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de disparo
        run: |
          curl -sf -X GET "https://portalwecare.com.br/api/cron/dispatch-reminders${{ inputs.force && '?force=1' || '' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
